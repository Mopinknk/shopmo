<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONALI SHOP · วงล้อสะสมแต้ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maitree:wght@400;500;600&family=Noto+Sans+Thai:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f4;--paper:#fffafb;--tx:#6b4d57;--hd:#a24a6c;--mu:#b08c9a;--bd:#f6d3de;--bl:#fbd0dd;--p:#ee7fa3;--p2:#dc5f8b;--g:#5aa88a;--y:#f0b44c;--mu2:#8a6371;--ok:#2b7a5a;--wn:#97650f;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2024;--paper:#35292e;--tx:#f1e0e0;--hd:#f3c7d2;--mu:#c3a9af;--bd:#4a3a40;--bl:#4a343b;--p2:#eba0b4;--mu2:#c3a9af;--ok:#7fd1b0;--wn:#f0c36d;--er:#ff8f9b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-weight:400;line-height:1.7;padding-bottom:40px}
h1,h2,h3{font-family:"Maitree","Noto Sans Thai",serif;font-weight:500;color:var(--hd)}
header{position:relative;text-align:center;padding:24px 16px 6px}
header>:last-child{position:absolute;right:14px;top:14px}
.brand{display:inline-flex;align-items:center;justify-content:center;gap:2px;font:italic 500 36px/1 "Cormorant Garamond",serif;color:var(--p2);letter-spacing:.02em}
.sec{border:0;background:transparent;color:var(--p);opacity:.35;padding:4px;cursor:pointer;line-height:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:center;gap:4px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}
nav a{text-decoration:none;color:var(--mu);font-size:14px;padding:6px 14px;position:relative;transition:color .2s}nav a svg{display:none}
nav a.on{color:var(--p2);font-weight:500}nav a.on::after{content:"";position:absolute;left:50%;bottom:0;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:var(--p)}
main{max-width:620px;margin:0 auto;padding:10px 20px}
body.adm main{max-width:920px}
.card{background:transparent;padding:32px 0 4px;margin:0}
h2{margin:0 0 16px;font-size:20px;display:flex;align-items:center;gap:14px}
h2::before,h2::after{content:"";flex:1;height:1px;background:var(--bd)}
#mb h2::before,#mb h2::after{display:none}#mb h2{justify-content:center}
h3{margin:0 0 10px;font-size:16px}
.hero{text-align:center;padding:36px 0 8px}
.eb{font:italic 500 16px "Cormorant Garamond",serif;letter-spacing:.32em;text-transform:uppercase;color:var(--p)}
.arch{position:relative;width:210px;height:250px;margin:18px auto 22px;border-radius:105px 105px 14px 14px;background:var(--bl);overflow:hidden}
.arch::before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.85);border-radius:97px 97px 8px 8px}
.arch::after{content:"";position:absolute;left:50%;top:38px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#fff;opacity:.8}
.hw{position:absolute;left:50%;bottom:-46px;width:200px;height:200px;margin-left:-100px;border-radius:50%;border:5px solid #fff;background:conic-gradient(#ff9db9 0 60deg,#fff1f4 0 120deg,#ffc2d4 0 180deg,#ffd9e3 0 240deg,#f7b0c8 0 300deg,#ffe6ed 0 360deg);animation:sl 26s linear infinite;box-shadow:0 8px 24px rgba(238,127,163,.35)}
.hw::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#fff}
@keyframes sl{to{transform:rotate(360deg)}}
.hero h1{margin:0 0 8px;font-size:30px;line-height:1.4}.hero p{margin:0 auto 22px;max-width:420px;color:var(--mu);font-size:15px}
.btn{border:0;border-radius:999px;padding:11px 26px;font:500 15px "Noto Sans Thai",sans-serif;cursor:pointer;background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(238,127,163,.35);transition:transform .15s,background .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{transform:translateY(-1px);background:#e46d95}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.s{padding:5px 15px;font-size:13px;box-shadow:none}
.btn.o{background:transparent;color:var(--p2);border:1px solid #f2a9c0;box-shadow:none}.btn.o:hover{background:var(--bl)}.btn.d{background:#e57a86}.btn.line{background:#06c755;box-shadow:0 6px 16px rgba(6,199,85,.22)}
.grid{display:flex;justify-content:center}
.stat{flex:1;text-align:center;padding:4px 10px;font-size:14px;color:var(--mu)}.stat+.stat{border-left:1px solid var(--bd)}.stat b{display:block;font:500 50px/1.1 "Cormorant Garamond",serif;color:var(--p2)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--bl);color:var(--p2);display:inline-flex;align-items:center;justify-content:center;font-weight:500;flex:none;border:3px solid #fff;box-shadow:0 2px 10px rgba(238,127,163,.3)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}
input,textarea,select{width:100%;padding:11px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--paper);color:var(--tx);font:inherit;margin:4px 0 12px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(255,170,195,.45)}
input[type=color]{padding:3px;height:44px}input[type=file]{padding:9px}
label{font-size:13px;color:var(--mu)}
.star{background:none;border:0;cursor:pointer;padding:2px;transition:transform .2s}.star:hover{transform:scale(1.15)}
.rv{background:var(--paper);border-radius:20px;padding:12px 16px;margin-top:12px;box-shadow:0 2px 14px rgba(190,120,140,.1)}.rv img.ph{max-width:200px;max-height:200px;border-radius:14px;margin-top:8px;display:block}
.prev{max-width:160px;max-height:160px;border-radius:14px;display:none;margin-bottom:8px}
#modal{position:fixed;inset:0;background:rgba(120,70,80,.28);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}#mb{position:relative;background:var(--paper);border-radius:28px;box-shadow:0 20px 50px rgba(150,80,100,.25);padding:26px;max-width:420px;width:100%;max-height:90vh;overflow:auto;animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--paper);color:var(--hd);padding:10px 22px;border-radius:999px;box-shadow:0 8px 28px rgba(150,80,100,.25);opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;max-width:90%}#toast.on{opacity:1}
.wheelbox{position:relative;width:min(320px,86vw);margin:26px auto 20px}.wheelbox canvas{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 0 0 10px #fff,0 16px 40px rgba(238,127,163,.38)}
.ptr{position:absolute;top:-22px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:30px solid var(--p);filter:drop-shadow(0 2px 3px rgba(120,60,80,.25))}
.hub{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff;color:var(--p);box-shadow:0 2px 14px rgba(238,127,163,.45);z-index:2;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 8px}.tabs button{white-space:nowrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--p2);font-weight:500;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;color:#6b4a52;font-size:14px}
.bigi{width:96px;height:96px;border-radius:50%;background:var(--bl);box-shadow:0 0 0 8px rgba(251,227,232,.5);display:inline-flex;align-items:center;justify-content:center;animation:bn .8s;color:var(--p)}@keyframes bn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.note{background:var(--bl);color:var(--hd);border-radius:14px;padding:8px 14px;font-size:13px;margin-bottom:12px}
.cfi{position:absolute;top:-12px;width:8px;height:13px;border-radius:50% 50% 50% 0;animation:cf 2.4s ease-in forwards;opacity:0;pointer-events:none}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(420px) rotate(400deg);opacity:0}}
a{color:var(--p2)}
/* ---------- admin ---------- */
[hidden]{display:none!important}
body.adm{--ap:#c2467a;--ap2:#a93a69}
body.adm main{max-width:1240px;padding:16px}
body.adm .mu{color:var(--mu2)}body.adm label{color:var(--tx)}
body.adm input,body.adm textarea,body.adm select{border-radius:10px;padding:9px 12px;margin:0}
body.adm .btn{border-radius:10px;box-shadow:none;background:var(--ap);padding:9px 16px;font-size:14px}
body.adm .btn:hover{background:var(--ap2);transform:none}
body.adm .btn.s{padding:6px 12px;font-size:13px}
body.adm .btn.o{background:transparent;color:var(--hd);border:1px solid var(--bd)}body.adm .btn.o:hover{background:var(--bl)}
body.adm .btn.d{background:var(--er);color:#fff}
body.adm .btn.dl{background:transparent;color:var(--er);border:1px solid color-mix(in srgb,var(--er) 45%,transparent)}body.adm .btn.dl:hover{background:color-mix(in srgb,var(--er) 10%,transparent)}
body.adm #mb{border-radius:16px;padding:22px;max-width:440px}
.btn:focus-visible,.a-ni:focus-visible,.sw:focus-visible,.icb:focus-visible{outline:2px solid var(--ap);outline-offset:2px}
.a-shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.a-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--bd);border-radius:16px;padding:14px}
.a-logo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap;padding:4px 8px 10px;border-bottom:1px solid var(--bd)}.a-logo b{font:italic 500 24px/1 "Cormorant Garamond",serif;color:var(--p2)}.a-logo span{font-size:13px;color:var(--mu2)}
.a-nav{display:flex;flex-direction:column;gap:2px}
.a-ni{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--tx);font:400 14px "Noto Sans Thai",sans-serif;text-align:left;cursor:pointer}
.a-ni span{flex:1}.a-ni em{font-style:normal;font-size:12px;opacity:.75}.a-ni:hover{background:var(--bl)}.a-ni.on{background:var(--ap);color:#fff;font-weight:500}
.a-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bd);padding-top:12px}
.a-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.a-top h1{margin:0;font-size:24px;line-height:1.3}.a-top p{margin:2px 0 0;font-size:14px;color:var(--mu2)}
.a-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.m-only{display:none}
.a-panel{background:var(--paper);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.a-panel>h3{margin:0 0 2px;font-size:16px}.a-panel>.mu{margin:0 0 14px}.a-panel.flush{padding:0;overflow:hidden}
.a-danger{border-color:color-mix(in srgb,var(--er) 40%,var(--bd))}
.a-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.a-stat{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--bd);border-radius:14px;padding:14px}
.a-si{width:38px;height:38px;border-radius:10px;background:var(--bl);color:var(--p2);display:flex;align-items:center;justify-content:center;flex:none}
.a-sv{font:500 24px/1.2 "Maitree","Noto Sans Thai",serif;color:var(--hd)}.a-sl{font-size:13px;color:var(--mu2)}
.a-split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.a-fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start;margin-bottom:16px}.a-fgrid .a-panel{margin:0}
.a-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fld{margin-bottom:14px}.fld label{display:block;margin-bottom:4px;font-size:13px;font-weight:500}.fld small{display:block;margin-top:4px;font-size:12px;color:var(--mu2)}
.a-save{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;padding:12px 14px;margin-bottom:16px;background:var(--paper);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(150,80,100,.15)}
.a-tool{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 14px 4px}
.a-search{position:relative;flex:1;min-width:200px;max-width:340px}.a-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu2);pointer-events:none}body.adm .a-search input{padding-left:38px}
.a-tbl{overflow-x:auto}.a-tbl table{min-width:520px}
.a-tbl th{padding:10px 14px;background:color-mix(in srgb,var(--bl) 45%,transparent);color:var(--mu2);font-weight:500;white-space:nowrap}
.a-tbl td{padding:12px 14px;vertical-align:middle}.a-tbl tr:last-child td{border-bottom:0}
.a-tbl .num{text-align:right;font-variant-numeric:tabular-nums}.a-tbl tbody tr:hover td{background:color-mix(in srgb,var(--bl) 30%,transparent)}
.a-empty,.a-tbl td.a-empty{padding:28px 14px;text-align:center;color:var(--mu2)}
.bdg{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:color-mix(in srgb,currentColor 13%,transparent)}
.bdg.ok{color:var(--ok)}.bdg.wn{color:var(--wn)}.bdg.er{color:var(--er)}.bdg.no{color:var(--mu2)}.pos{color:var(--ok);font-weight:500}.neg{color:var(--er);font-weight:500}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.sw{position:relative;width:40px;height:24px;padding:0;border:0;border-radius:999px;background:color-mix(in srgb,var(--mu2) 45%,var(--paper));cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}.sw.on{background:#3f9d77}.sw.on::after{transform:translateX(16px)}
.a-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.a-pc{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--bd);border-radius:14px;padding:14px}.a-pc.out{opacity:.65}.a-pc .mu b{color:var(--tx)}
.a-sw{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:#6b4a52;border:1px solid rgba(0,0,0,.06)}
.a-bar{height:6px;margin-top:4px;border-radius:99px;background:var(--bl);overflow:hidden}.a-bar i{display:block;height:100%;border-radius:99px;background:var(--ap)}
.a-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.a-feed{margin:0;padding:0;list-style:none}.a-feed li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.a-feed li:last-child{border:0}
.a-revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.a-revs .rv{margin:0;border:1px solid var(--bd);border-radius:14px;box-shadow:none}.rv.off{opacity:.6}
.a-sec{padding:14px 0;border-top:1px solid var(--bd)}.a-sec h4{margin:0 0 2px;font:500 15px "Noto Sans Thai",sans-serif;color:var(--hd)}.a-sec p{margin:0}body.adm .a-sec>input{margin-top:8px}
.a-inl{display:flex;gap:8px;margin-top:8px}.a-inl input{flex:1;min-width:0}
.a-chips{display:flex;gap:8px;margin-bottom:14px}.a-chips span{padding:4px 12px;border-radius:999px;background:var(--bl);color:var(--hd);font-size:13px}
.icg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icb{height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:10px;background:var(--paper);color:var(--tx);cursor:pointer}.icb.on{border-color:var(--ap);background:var(--bl);color:var(--hd);box-shadow:inset 0 0 0 1px var(--ap)}
.a-login{min-height:70vh;display:flex;align-items:center;justify-content:center}
.a-lp{width:100%;max-width:360px;padding:28px;text-align:center;background:var(--paper);border:1px solid var(--bd);border-radius:16px}
.a-lock{width:52px;height:52px;margin-bottom:10px;display:inline-flex;align-items:center;justify-content:center;border-radius:14px;background:var(--bl);color:var(--p2)}
.a-lp h1{margin:0 0 4px;font-size:22px}.a-lp .fld{margin:16px 0;text-align:left}.a-lp a{color:var(--hd)}
@media(min-width:901px){.a-grid2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
@media(max-width:1100px){.a-split{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
.a-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.a-shell{grid-template-columns:minmax(0,1fr);gap:14px}
.a-side{top:env(safe-area-inset-top,0px);z-index:6;padding:8px;border-radius:14px}
.a-logo,.a-foot{display:none}
.a-nav{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none}.a-ni{width:auto;flex:none;white-space:nowrap}
.m-only{display:flex}}
@media(prefers-reduced-motion:reduce){body.adm *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="hd"></header>
<nav id="nv"></nav>
<main id="app"></main>
<div id="modal"><div id="mb"></div></div>
<div id="toast"></div>
<script>
/* ===== ตั้งค่า LINE Login จริง: ใส่ LIFF ID จาก LINE Developers ที่นี่ (ว่าง = โหมดทดลอง) ===== */

function compress(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file)})}

const gen=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(8);crypto.getRandomValues(r);return Array.from(r,x=>a[x%a.length]).join('')};

function useCode(){const m=me();if(!m)return loginM();
if(tmp.lock&&Date.now()<tmp.lock)return toast('กรอกผิดหลายครั้ง กรุณารอ '+Math.ceil((tmp.lock-Date.now())/1e3)+' วินาที');
const v=($('#cd').value||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');if(!v)return toast('กรุณากรอกโค้ด');
const c=DB.codes.find(x=>x.code===v),bad=t=>{tmp.fails=(tmp.fails||0)+1;if(tmp.fails>=5){tmp.lock=Date.now()+6e4;tmp.fails=0}toast(t)};
if(!c)return bad('ไม่พบโค้ดนี้');if(!c.on)return bad('โค้ดนี้ปิดใช้งานแล้ว');if(c.exp&&Date.now()>c.exp)return bad('โค้ดนี้หมดอายุแล้ว');
if(c.used.some(u=>u.uid===m.id))return toast('คุณใช้โค้ดนี้ไปแล้ว');if(c.max&&c.used.length>=c.max)return bad('โค้ดนี้ถูกใช้ครบแล้ว');
c.used.push({uid:m.id,t:Date.now()});m.points+=c.pts;DB.plog.unshift({uid:m.id,d:c.pts,note:'ใช้โค้ด '+c.code,t:Date.now()});tmp.fails=0;save();
modal(`<div style="text-align:center"><div class="bigi">ic('gift',46,'var(--p)')</div><h2>รับแต้มสำเร็จ</h2><p>ได้รับ<b>{c.pts}</b> แต้ม</p><button class="btn" onclick="closeM();render()">ตกลง</button></div>`);render()}
function addCode(){let c=('#c1').value.trim().toUpperCase().replace(/[A-Z0-9-]/g,'');constpts=parseInt(('#c2').value),mx=parseInt(('#c3').value),ex=('#c4').value;
if(!c)c=gen();if(DB.codes.some(x=>x.code===c))return toast('มีโค้ดนี้อยู่แล้ว');if(!(pts>0))return toast('ใส่จำนวนแต้มมากกว่า 0');if(!(mx>=0))return toast('จำนวนครั้งต้องไม่ติดลบ');
DB.codes.unshift({id:Date.now(),code:c,pts,max:mx,exp:ex?new Date(ex+'T23:59:59').getTime():0,on:true,used:[],t:Date.now()});save();toast('สร้างโค้ด '+c+' แล้ว');render()}

<div class="a-two"><div class="fld"><label for="c2">แต้มที่ได้</label><input id="c2" type="number" min="1" value="5"></div><div class="fld"><label for="c3">ใช้ได้กี่ครั้ง</label><input id="c3" type="number" min="0" value="1"><small>0 = ไม่จำกัด</small></div></div>
<div class="fld"><label for="c4">วันหมดอายุ</label><input id="c4" type="date"><small>เว้นว่างถ้าไม่มีวันหมดอายุ</small></div><button class="btn" style="width:100%" onclick="addCode()">สร้างโค้ด</button></div>
<div class="a-panel flush">${tbl('<th>โค้ด</th><th class="num">แต้ม</th><th class="num">ใช้แล้ว</th><th>หมดอายุ</th><th>สถานะ</th><th></th>',DB.codes.map(c=>{const s=codeSt(c);return `<tr><td><b class="code">${esc(c.code)}</b></td><td class="num">c.pts</td><tdclass="num">{c.used.length}c.max?'/'+c.max:''</td><td>{c.exp?new Date(c.exp).toLocaleDateString('th-TH'):'-'}</td><td><span class="bdg s[0]">{s[1]}</span></td><td><div class="row" style="justify-content:flex-end"><button class="btn s o" onclick="copyCode('c.code')">คัดลอก</button><buttonclass="btnso"onclick="codeUsers({c.id})">ผู้ใช้</button><button class="swc.on?'on':''"role="switch"aria-checked="{!!c.on}" aria-label="เปิดใช้โค้ด esc(c.code)"onclick="togCode({c.id})"></button><button class="btn s dl" aria-label="ลบโค้ด esc(c.code)"onclick="ask('ลบโค้ดนี้?',()=>delCode({c.id}))">${ic('trash',14)}</button></div></td></tr>`}).join(''),6)}</div></div>`}
function prHtml(){const tw=DB.prizes.filter(p=>p.stock!==0&&p.weight>0).reduce((s,p)=>s+p.weight,0);
return `<div class="a-cards">${DB.prizes.map(p=>{const out=p.stock===0,ch=!out&&tw?Math.round(p.weight/tw*1000)/10:0;return `<div class="a-pc${out?' out':''}"><div class="row"><span class="a-sw" style="background:esc(p.color)">{ic(p.ic,22)}</span><div style="min-width:0;flex:1"><b>esc(p.name)</b><divclass="mu">{out?'ของหมดแล้ว':p.stock<0?'จำนวนไม่จำกัด':'เหลือ '+p.stock+' ชิ้น'}</div></div></div><div><div class="row sp mu"><span>โอกาสออก</span><b>ch%</b></div><divclass="a-bar"><istyle="width:{ch}%"></i></div></div><div class="row"><button class="btn s o" style="flex:1" onclick="prM(${p.id})">แก้ไข</button><button class="btn s dl" aria-label="ลบรางวัล esc(p.name)"onclick="ask('ลบรางวัลนี้?',()=>delPr({p.id}))">${ic('trash',14)}</button></div></div>`}).join('')}</div>`}
const histHtml=()=>`<div class="a-panel flush"><div class="a-tool"><span class="mu">ทั้งหมด DB.slog.lengthครั้ง</span></div>{tbl('<th>เวลา</th><th>สมาชิก</th><th>รางวัลที่ได้</th>',DB.slog.map(s=>`<tr><td class="mu">fmt(s.t)</td><td>{nm(s.uid)}</td><td><span class="row">ic(s.ic||'gift',16,'var(--p2)'){esc(s.prize)}</span></td></tr>`).join(''),3)}</div>`;
const ledgerHtml=()=>`<div class="a-panel flush"><div class="a-tool"><span class="mu">ทั้งหมด DB.plog.lengthรายการ</span></div>{tbl('<th>เวลา</th><th>สมาชิก</th><th>หมายเหตุ</th><th class="num">แต้ม</th>',DB.plog.map(s=>`<tr><td class="mu">fmt(s.t)</td><td>{nm(s.uid)}</td><td>${esc(s.note)}</td><td class="num s.d>0?'pos':'neg'">{s.d>0?'+':''}${s.d}</td></tr>`).join(''),4)}</div>`;
const revHtml=()=>`<div class="a-revs">${DB.reviews.map(r=>rvHtml(r,true)).join('')||'<div class="a-panel a-empty">ยังไม่มีรีวิว</div>'}</div>`;
function adminHtml(){if(!DB.adm)return `<div class="a-login"><div class="a-lp"><span class="a-lock">${ic('lock',26)}</span><h1>หลังบ้านแอดมิน</h1><p class="mu">กรอก PIN เพื่อเข้าจัดการระบบ</p><div class="fld"><label for="ap">PIN</label><input id="ap" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')adLogin()"></div><button class="btn" style="width:100%" onclick="adLogin()">เข้าสู่ระบบ</button><div class="note" style="margin:14px 0">PIN ตัวอย่างในโหมดทดลอง: 1234</div><a href="#home">กลับหน้าร้าน</a></div></div>`;
const body={o:ovHtml,m:memHtml,r:rulesHtml,c:codesHtml,p:prHtml,h:histHtml,l:ledgerHtml,v:revHtml}[atab](),d=AD[atab],ex=`<button class="btn s o" onclick="go('home')">กลับหน้าร้าน</button><button class="btn s o" onclick="adOut()">ออกจากระบบ</button>`;
const nav=AT.map(t=>{const n=atCnt(t[0]);return `<button class="a-niatab===t[0]?'on':''"onclick="atab='{t[0]}';render()"atab===t[0]?'aria-current="page"':''>{ic(t[1],18)}<span>t[2]</span>{n!=null?`<em>${n}</em>`:''}</button>`}).join('');
return `<div class="a-shell"><aside class="a-side"><div class="a-logo"><b>MONALI SHOP</b><span>หลังบ้าน</span></div><div class="a-nav">nav</div><divclass="a-foot">{ex}</div></aside><section><div class="a-top"><div><h1>d[0]</h1><p>{d[1]}</p></div><div class="a-act">${atab==='p'?`<span class="mu">${DB.prizes.length}/12 ช่อง</span><button class="btn" onclick="prM(0)">+ เพิ่มรางวัล</button>`:''}<div class="a-act m-only">ex</div></div></div>{body}</section></div>`}

/* ---------- pages ---------- */
const P={
home(){const m=me(),R=DB.rules;return `<div class="card hero"><span class="eb">MONALI SHOP</span><div class="arch"><div class="hw"></div></div><h1>หมุนวงล้อ ลุ้นรางวัล</h1><p>ซื้อครบ ${R.spinAmt.toLocaleString()} บาท หรือสะสมแต้มครบ R.perSpinแต้มรับสิทธิ์หมุนวงล้อ</p>{m?`<button class="btn" onclick="go('wheel')">ไปหมุนวงล้อ</button>`:`<button class="btn line" onclick="loginM()">เข้าสู่ระบบด้วย LINE</button>`}</div>
${m?`<div class="card"><div class="row">${av(m,48)}<div><b>esc(m.name)</b><divclass="mu">สมาชิกLINE</div></div></div><divclass="grid"style="margin-top:12px"><divclass="stat"><b>{m.points}</b>แต้มสะสม</div><div class="stat"><b>${m.spins}</b>สิทธิ์หมุน</div></div></div>`:''}
m?codeBox():''{termsHtml()}
<div class="card"><div class="row sp"><h2>รีวิวจากลูกค้า</h2><a href="#reviews" class="mu">ดูทั้งหมด</a></div><div class="row">stars(Math.round(avg()))<b>{avg().toFixed(1)}</b> <span class="mu">(vis().lengthรีวิว)</span></div>{vis().slice(0,3).map(r=>rvHtml(r)).join('')||'<p class="mu">ยังไม่มีรีวิว</p>'}</div>`},
wheel(){const m=me();return `<div class="card" style="text-align:center"><h2 style="justify-content:center">วงล้อลุ้นรางวัล</h2><div class="wheelbox"><div class="ptr"></div><canvas id="wc" style="transition:none"></canvas><div class="hub">${ic('star',24,'currentColor','currentColor')}</div></div>
${m?`<p>แต้ม <b>${m.points}</b> · สิทธิ์หมุน <b>${m.spins}</b></p>`:'<p class="mu">เข้าสู่ระบบเพื่อหมุนวงล้อ</p>'}<div class="row wrap" style="justify-content:center"><button class="btn" id="sb" onclick="spin()">${m?'หมุนเลย':'เข้าสู่ระบบด้วย LINE'}</button>${m?`<button class="btn o" onclick="redeem()">แลก ${DB.rules.perSpin} แต้ม = 1 สิทธิ์</button>`:''}</div></div>
<div class="card"><h3>รางวัลในวงล้อ</h3><div class="row wrap">${DB.prizes.map(p=>`<span class="chip" style="background:${p.color}">${ic(p.ic,16)} esc(p.name){p.stock===0?' (หมด)':''}</span>`).join('')}</div></div>
${m?`<div class="card"><h3>ประวัติการหมุนของฉัน</h3>${DB.slog.filter(s=>s.uid===m.id).map(s=>`<div class="row sp" style="padding:6px 0;border-bottom:1px dashed var(--bd)"><span class="row">${ic(s.ic||'gift',18,'var(--p2)')} esc(s.prize)</span><spanclass="mu">{fmt(s.t)}</span></div>`).join('')||'<p class="mu">ยังไม่เคยหมุน</p>'}</div>`:''}`},
reviews(){const m=me();let l=vis();if(onlyMine&&m)l=DB.reviews.filter(r=>r.uid===m.id);return `<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:800;color:var(--p2)">avg().toFixed(1)</div>{stars(Math.round(avg()))}<div class="mu">จาก ${vis().length} รีวิว</div></div>
<div class="card"><h2>เขียนรีวิว</h2><p class="mu" style="text-align:center;margin-top:-6px">${m?`รีวิวแล้ว rvCount(m)/{rvMax()} ครั้ง · `:''}${rvPts()>0?`รีวิวรับ ${rvPts()} แต้ม · `:''}เว้น rvCd()ชม.ระหว่างรีวิว</p>{m?`<div>${[1,2,3,4,5].map(n=>`<button class="star" onclick="setStar(${n})" aria-label="nดาว">{ic('star',30,'var(--y)',(tmp.st||0)>=n?'var(--y)':'none')}</button>`).join('')}</div><textarea id="rt" rows="3" maxlength="500" placeholder="เล่าประสบการณ์ของคุณ..."></textarea><label>แนบรูปภาพ (เลือกจากเครื่อง)</label><input type="file" id="rf" accept="image/*" onchange="pick(this,'ri','rpv',800)"><img id="rpv" class="prev" alt=""><div class="row"><button class="btn" onclick="sendRv()">ส่งรีวิว</button><button class="btn s o" onclick="clrImg('ri','rpv','rf')">ลบรูป</button></div>`:`<p class="mu">เข้าสู่ระบบก่อนจึงจะรีวิวได้</p><button class="btn line" onclick="loginM()">เข้าสู่ระบบด้วย LINE</button>`}</div>
<div class="card"><div class="row sp wrap"><h2>รีวิวทั้งหมด</h2>${m?`<button class="btn s o" onclick="onlyMine=!onlyMine;render()">${onlyMine?'ดูทั้งหมด':'เฉพาะของฉัน'}</button>`:''}</div>${l.map(r=>rvHtml(r)).join('')||'<p class="mu">ยังไม่มีรีวิว</p>'}</div>`},
me(){const m=me();if(!m)return `<div class="card" style="text-align:center"><h2 style="justify-content:center">บัญชีของฉัน</h2><p class="mu">เข้าสู่ระบบเพื่อดูแต้มและประวัติ</p><button class="btn line" onclick="loginM()">เข้าสู่ระบบด้วย LINE</button></div>`;
return `<div class="card"><div class="row sp"><div class="row">av(m,56)<div><b>{esc(m.name)}</b><div class="mu">esc(m.id)</div></div></div><buttonclass="btnso"onclick="logout()">ออกจากระบบ</button></div><divclass="grid"style="margin-top:12px"><divclass="stat"><b>{m.points}</b>แต้มสะสม</div><div class="stat"><b>${m.spins}</b>สิทธิ์หมุน</div></div><div style="margin-top:12px"><button class="btn" onclick="redeem()">แลก ${DB.rules.perSpin} แต้ม เป็นสิทธิ์หมุน</button></div></div>
codeBox()<divclass="card"><h3>ประวัติแต้ม</h3>{DB.plog.filter(s=>s.uid===m.id).map(s=>`<div class="row sp" style="padding:6px 0;border-bottom:1px dashed var(--bd)"><div>esc(s.note)<divclass="mu">{fmt(s.t)}</div></div><b style="color:s.d>0?'var(--g)':'#ff7a8a'">{s.d>0?'+':''}${s.d}</b></div>`).join('')||'<p class="mu">ยังไม่มีประวัติ</p>'}</div>
<div class="card"><h3>รางวัลที่ได้รับ</h3>${DB.slog.filter(s=>s.uid===m.id).map(s=>`<div class="row sp" style="padding:6px 0;border-bottom:1px dashed var(--bd)"><span class="row">${ic(s.ic||'gift',18,'var(--p2)')} esc(s.prize)</span><spanclass="mu">{fmt(s.t)}</span></div>`).join('')||'<p class="mu">ยังไม่มีรางวัล</p>'}</div>
<div class="card"><h3>รีวิวของฉัน</h3>${DB.reviews.filter(r=>r.uid===m.id).map(r=>rvHtml(r)).join('')||'<p class="mu">ยังไม่เคยรีวิว</p>'}</div>`},
admin:adminHtml};
function render(){const r=(location.hash||'#home').slice(1),k=P[r]?r:'home',m=me(),adm=k==='admin';
document.body.classList.toggle('adm',adm);('#hd').style.display=('#nv').style.display=adm?'none':'';
('#hd').innerHTML=`<spanclass="brand">MONALISHOP<buttonclass="sec"onclick="secret()"tabindex="-1"aria-hidden="true">{ic('sparkle',12)}</button></span>${m?`<a href="#me" class="row" style="text-decoration:none;color:inherit">${av(m,32)}<span style="font-size:13px">${m.points} แต้ม</span></a>`:`<button class="btn s line" onclick="loginM()">LINE Login</button>`}`;
('#nv').innerHTML=[['home','home','Home'],['wheel','wheel','Wheel'],['reviews','msg','Reviews'],['me','user','Me']].map(t=>`<ahref="#{t[0]}" class="k===t[0]?'on':''">{ic(t[1],22)}${t[2]}</a>`).join('');
$('#app').innerHTML=P[k]();if(k==='wheel')drawWheel();const sk=adm?'a:'+atab:null;if(!busy&&(!adm||render.k!==sk))window.scrollTo(0,0);render.k=sk;if(adm&&!DB.adm){const e=$('#ap');if(e)e.focus()}}
window.addEventListener('hashchange',render);render();initLine();
if(document.fonts)document.fonts.ready.then(()=>{if($('#wc')&&!busy)drawWheel()});
</script>
</body>
</html>
