a{color:var(--p2)}
/* ---------- admin ---------- */
[hidden]{display:none!important}
body.adm{--ap:#c2467a;--ap2:#a93a69}
body.adm main{max-width:1240px;padding:16px}
body.adm .mu{color:var(--mu2)}body.adm label{color:var(--tx)}
body.adm input,body.adm textarea,body.adm select{border-radius:10px;padding:9px 12px;margin:0}
body.adm .btn{border-radius:10px;box-shadow:none;background:var(--ap);padding:9px 16px;font-size:14px}
body.adm .btn:hover{background:var(--ap2);transform:none}

body.adm .btn.o{background:transparent;color:var(--hd);border:1px solid var(--bd)}body.adm .btn.o:hover{background:var(--bl)}
body.adm .btn.d{background:var(--er);color:#fff}

.btn:focus-visible,.a-ni:focus-visible,.sw:focus-visible,.icb:focus-visible{outline:2px solid var(--ap);outline-offset:2px}
.a-shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.a-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--bd);border-radius:16px;padding:14px}
.a-logo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap;padding:4px 8px 10px;border-bottom:1px solid var(--bd)}.a-logo b{font:italic 500 24px/1 "Cormorant Garamond",serif;color:var(--p2)}.a-logo span{font-size:13px;color:var(--mu2)}
.a-nav{display:flex;flex-direction:column;gap:2px}
.a-ni{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--tx);font:400 14px "Noto Sans Thai",sans-serif;text-align:left;cursor:pointer}
.a-ni span{flex:1}.a-ni em{font-style:normal;font-size:12px;opacity:.75}.a-ni:hover{background:var(--bl)}.a-ni.on{background:var(--ap);color:#fff;font-weight:500}
.a-foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bd);padding-top:12px}
.a-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.a-top h1{margin:0;font-size:24px;line-height:1.3}.a-top p{margin:2px 0 0;font-size:14px;color:var(--mu2)}
.a-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.m-only{display:none}
.a-panel{background:var(--paper);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.a-panel>h3{margin:0 0 2px;font-size:16px}.a-panel>.mu{margin:0 0 14px}.a-panel.flush{padding:0;overflow:hidden}
.a-danger{border-color:color-mix(in srgb,var(--er) 40%,var(--bd))}

.a-si{width:38px;height:38px;border-radius:10px;background:var(--bl);color:var(--p2);display:flex;align-items:center;justify-content:center;flex:none}
.a-sv{font:500 24px/1.2 "Maitree","Noto Sans Thai",serif;color:var(--hd)}.a-sl{font-size:13px;color:var(--mu2)}
.a-split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.a-fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start;margin-bottom:16px}.a-fgrid .a-panel{margin:0}
.a-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fld{margin-bottom:14px}.fld label{display:block;margin-bottom:4px;font-size:13px;font-weight:500}.fld small{display:block;margin-top:4px;font-size:12px;color:var(--mu2)}
.a-save{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;padding:12px 14px;margin-bottom:16px;background:var(--paper);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(150,80,100,.15)}

.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}

.a-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.a-pc{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--bd);border-radius:14px;padding:14px}.a-pc.out{opacity:.65}.a-pc .mu b{color:var(--tx)}
.a-sw{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:#6b4a52;border:1px solid rgba(0,0,0,.06)}

.a-inl{display:flex;gap:8px;margin-top:8px}.a-inl input{flex:1;min-width:0}
.a-chips{display:flex;gap:8px;margin-bottom:14px}.a-chips span{padding:4px 12px;border-radius:999px;background:var(--bl);color:var(--hd);font-size:13px}
.icg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icb{height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:10px;background:var(--paper);color:var(--tx);cursor:pointer}.icb.on{border-color:var(--ap);background:var(--bl);color:var(--hd);box-shadow:inset 0 0 0 1px var(--ap)}
.a-login{min-height:70vh;display:flex;align-items:center;justify-content:center}
.a-lp{width:100%;max-width:360px;padding:28px;text-align:center;background:var(--paper);border:1px solid var(--bd);border-radius:16px}

.a-lp h1{margin:0 0 4px;font-size:22px}.a-lp .fld{margin:16px 0;text-align:left}.a-lp a{color:var(--hd)}
@media(min-width:901px){.a-grid2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}

.a-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.a-shell{grid-template-columns:minmax(0,1fr);gap:14px}
.a-side{top:env(safe-area-inset-top,0px);z-index:6;padding:8px;border-radius:14px}
.a-logo,.a-foot{display:none}
.a-nav{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none}.a-ni{width:auto;flex:none;white-space:nowrap}

@media(prefers-reduced-motion:reduce){body.adm *{transition:none!important;animation:none!important}}
</style>

${m?`<div class="card"><h3>ประวัติการหมุนของฉัน</h3>${lg(DB.mine.slog,'ยังไม่เคยหมุน',spinRow)}</div>`:''}`},
reviews(){const m=me();let l=vis();if(onlyMine&&m)l=DB.mine.reviews;return `<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:800;color:var(--p2)">${avg().toFixed(1)}</div>${stars(Math.round(avg()))}<div class="mu">จาก ${vis().length} รีวิว</div></div>
<div class="card"><h2>เขียนรีวิว</h2><p class="mu" style="text-align:center;margin-top:-6px">${m?`รีวิวแล้ว ${rvCount(m)}/${rvMax()} ครั้ง · `:''}${rvPts()>0?`รีวิวรับ ${rvPts()} แต้ม · `:''}เว้น ${rvCd()} ชม.ระหว่างรีวิว</p>${m?`<div>${[1,2,3,4,5].map(n=>`<button class="star" onclick="setStar(${n})" aria-label="${n} ดาว">${ic('star',30,'var(--y)',(tmp.st||0)>=n?'var(--y)':'none')}</button>`).join('')}</div><textarea id="rt" rows="3" maxlength="500" placeholder="เล่าประสบการณ์ของคุณ..."></textarea><label class="row" style="gap:8px;margin:0 0 4px;cursor:pointer;color:var(--tx)"><input type="checkbox" id="rmk" ${tmp.mk?'checked':''} onchange="setMask(this.checked)" style="width:auto;margin:0"> ซ่อนชื่อ LINE บางส่วน</label><div class="mu" id="rmkp" style="margin:0 0 12px 26px">${maskPv(m)}</div><label>แนบรูปภาพ (เลือกจากเครื่อง)</label><input type="file" id="rf" accept="image/*" onchange="pick(this,'ri','rpv',800)"><img id="rpv" class="prev" alt=""><div class="row"><button class="btn" onclick="sendRv()">ส่งรีวิว</button><button class="btn s o" onclick="clrImg('ri','rpv','rf')">ลบรูป</button></div>`:`<p class="mu">เข้าสู่ระบบก่อนจึงจะรีวิวได้</p><button class="btn line" onclick="loginM()">เข้าสู่ระบบด้วย LINE</button>`}</div>
<div class="card"><div class="row sp wrap"><h2>รีวิวทั้งหมด</h2>${m?`<button class="btn s o" onclick="onlyMine=!onlyMine;render()">${onlyMine?'ดูทั้งหมด':'เฉพาะของฉัน'}</button>`:''}</div>${l.map(r=>rvHtml(r)).join('')||'<p class="mu">ยังไม่มีรีวิว</p>'}</div>`},
me(){const m=me();if(!m)return `<div class="card" style="text-align:center"><h2 style="justify-content:center">บัญชีของฉัน</h2><p class="mu">เข้าสู่ระบบเพื่อดูแต้มและประวัติ</p><button class="btn line" onclick="loginM()">เข้าสู่ระบบด้วย LINE</button></div>`;
return `<div class="card"><div class="row sp"><div class="row">${av(m,56)}<div><b>${esc(m.name)}</b><div class="mu">${esc(m.id)}</div></div></div><button class="btn s o" onclick="logout()">ออกจากระบบ</button></div><div class="grid" style="margin-top:12px"><div class="stat"><b>${m.points}</b>แต้มสะสม</div><div class="stat"><b>${m.spins}</b>สิทธิ์หมุน</div></div><div style="margin-top:12px"><button class="btn" onclick="redeem()">แลก ${DB.rules.perSpin} แต้ม เป็นสิทธิ์หมุน</button></div></div>
${codeBox()}<div class="card"><h3>ประวัติแต้ม</h3>${lg(DB.mine.plog,'ยังไม่มีประวัติ',s=>`<div class="row sp" style="padding:6px 0;border-bottom:1px dashed var(--bd)"><div>${esc(s.note)}<div class="mu">${fmt(s.t)}</div></div><b style="color:${s.d>0?'var(--g)':'#ff7a8a'}">${s.d>0?'+':''}${s.d}</b></div>`)}</div>
<div class="card"><h3>รางวัลที่ได้รับ</h3>${lg(DB.mine.slog,'ยังไม่มีรางวัล',spinRow)}</div>
<div class="card"><h3>รีวิวของฉัน</h3>${lg(DB.mine.reviews,'ยังไม่เคยรีวิว',r=>rvHtml(r))}</div>`},
admin:adminHtml};
const errHtml=()=>`<div class="card" style="text-align:center"><h2 style="justify-content:center">เชื่อมต่อฐานข้อมูลไม่ได้</h2><p class="mu">${esc(DB.err.message||'')}</p><p class="mu">ตรวจสอบว่ารันสคริปต์ SQL ใน Supabase แล้ว และ URL/KEY ถูกต้อง</p><button class="btn" onclick="boot()">ลองใหม่</button></div>`;
function render(){const k=route(),m=me(),ad=k==='admin';
document.body.classList.toggle('adm',ad);$('#hd').style.display=$('#nv').style.display=ad?'none':'';
$('#hd').innerHTML=`<span class="brand">${esc(DB.shop)}<button class="sec" onclick="secret()" tabindex="-1" aria-hidden="true">${ic('sparkle',12)}</button></span>${m?`<a href="#me" class="row" style="text-decoration:none;color:inherit">${av(m,32)}<span style="font-size:13px">${m.points} แต้ม</span></a>`:`<button class="btn s line" onclick="loginM()">LINE Login</button>`}`;
$('#nv').innerHTML=[['home','home','Home'],['wheel','wheel','Wheel'],['reviews','msg','Reviews'],['me','user','Me']].map(t=>`<a href="#${t[0]}" class="${k===t[0]?'on':''}">${ic(t[1],22)}${t[2]}</a>`).join('');
$('#app').innerHTML=(DB.err&&!ad)?errHtml():(!DB.ready&&!ad)?'<div class="card" style="text-align:center"><p class="mu">กำลังโหลดข้อมูล...</p></div>':P[k]();
if(DB.ready&&!DB.err&&k==='wheel')drawWheel();
const sk=ad?'a:'+atab:null;if(!busy&&(!ad||render.k!==sk))window.scrollTo(0,0);render.k=sk;if(ad&&!DB.adm){const e=$('#ap');if(e)e.focus()}}
/* ---------- เริ่มระบบ ---------- */
const snap=()=>JSON.stringify([DB.prizes,DB.reviews,DB.rules,DB.terms,DB.termsTitle,DB.me,DB.mine]);
async function softRefresh(){if(busy||!DB.ready||route()==='admin')return;const a=document.activeElement,b=snap();
try{await loadPublic();if(DB.ses)await loadMe()}catch(e){return}
if(snap()!==b&&!busy&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render()}
async function boot(){DB.err=null;DB.ready=false;render();
try{await loadPublic();DB.ready=true}catch(e){DB.err=e}
if(!DB.err){if(!LIFF_ID){const s=LS.get('lw_ses');if(s&&/^[A-Za-z0-9_-]{1,64}$/.test(s)){DB.ses=s;try{await loadMe()}catch(e){}}}
const p=SS.get('lw_pin');if(p){try{if(await rpc('admin_login',{p_pin:p})){DB.pin=p;DB.adm=true;if(route()==='admin')await loadAdmin()}else SS.del('lw_pin')}catch(e){}}}
render();initLine()}
window.addEventListener('hashchange',async()=>{render();if(route()==='admin'){if(DB.adm){try{await loadAdmin();render()}catch(e){fail(e)}}}else softRefresh()});
boot();
if(document.fonts)document.fonts.ready.then(()=>{if($('#wc')&&!busy)drawWheel()});
</script>
</body>
</html>
